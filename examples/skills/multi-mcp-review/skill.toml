schema_version = 1
name = "multi-mcp-review"
description = "Review code using repository files and pull request metadata"
instructions_file = "instructions.md"
allowed_tools = [
  "mcp:filesystem:read_file",
  "mcp:filesystem:search_files",
  "mcp:github:get_pull_request",
  "mcp:github:get_pull_request_diff",
]

[limits]
max_model_turns = 8
max_tool_calls_total = 24
