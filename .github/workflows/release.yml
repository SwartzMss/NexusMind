name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check dependencies
        run: python -m pip check

      - name: Run test suite
        run: python -m pytest -vv

  python-package:
    name: Python release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Validate tag and source metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected = {
              "version": "0.1.0",
              "requires-python": ">=3.11,<3.14",
              "license": "MIT",
          }
          for key, value in expected.items():
              if project.get(key) != value:
                  raise SystemExit(f"{key} must be {value!r}, got {project.get(key)!r}")
          if os.environ["GITHUB_REF_NAME"] != f"v{expected['version']}":
              raise SystemExit("release tag does not match package version")
          PY

      - name: Build wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "build>=1,<2"
          python -m build
          test -f dist/nexusmind-0.1.0-py3-none-any.whl
          test -f dist/nexusmind-0.1.0.tar.gz
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Clean-install and verify wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv-wheel"
          "$RUNNER_TEMP/venv-wheel/bin/python" -m pip install "$GITHUB_WORKSPACE/dist/nexusmind-0.1.0-py3-none-any.whl"
          "$RUNNER_TEMP/venv-wheel/bin/python" -m pip check
          "$RUNNER_TEMP/venv-wheel/bin/nexusmind" --help
          "$RUNNER_TEMP/venv-wheel/bin/python" - <<'PY'
          import importlib.metadata
          from pathlib import Path
          import sys

          metadata = importlib.metadata.metadata("nexusmind")
          if metadata["Version"] != "0.1.0":
              raise SystemExit("installed wheel version mismatch")
          if (metadata.get("License-Expression") or metadata.get("License")) != "MIT":
              raise SystemExit("installed wheel license mismatch")
          scripts = {item.name: item for item in importlib.metadata.entry_points(group="console_scripts")}
          for name in ("nexusmind", "nexusmind-kb"):
              if not Path(sys.executable).with_name(name).is_file() or name not in scripts or not callable(scripts[name].load()):
                  raise SystemExit(f"installed entrypoint is not usable: {name}")
          PY

      - name: Clean-install and verify sdist
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv-sdist"
          "$RUNNER_TEMP/venv-sdist/bin/python" -m pip install "$GITHUB_WORKSPACE/dist/nexusmind-0.1.0.tar.gz"
          "$RUNNER_TEMP/venv-sdist/bin/python" -m pip check
          "$RUNNER_TEMP/venv-sdist/bin/nexusmind" --help
          "$RUNNER_TEMP/venv-sdist/bin/python" - <<'PY'
          import importlib.metadata
          from pathlib import Path
          import sys

          metadata = importlib.metadata.metadata("nexusmind")
          if metadata["Version"] != "0.1.0":
              raise SystemExit("installed sdist version mismatch")
          if (metadata.get("License-Expression") or metadata.get("License")) != "MIT":
              raise SystemExit("installed sdist license mismatch")
          scripts = {item.name: item for item in importlib.metadata.entry_points(group="console_scripts")}
          for name in ("nexusmind", "nexusmind-kb"):
              if not Path(sys.executable).with_name(name).is_file() or name not in scripts or not callable(scripts[name].load()):
                  raise SystemExit(f"installed entrypoint is not usable: {name}")
          PY

      - name: Upload verified Python distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-release-distributions
          path: |
            dist/nexusmind-0.1.0-py3-none-any.whl
            dist/nexusmind-0.1.0.tar.gz
          if-no-files-found: error

  windows-portable:
    name: Windows portable release
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: Run portable packaging tests
        run: python -m pytest tests/test_runtime_support.py tests/test_desktop.py tests/test_portable_packaging.py -vv

      - name: Build and E2E smoke-test portable ZIP
        shell: pwsh
        run: |
          ./scripts/build-portable.ps1
          if (-not (Test-Path -Path "dist/nexusmind-windows-portable.zip" -PathType Leaf)) {
            throw "Portable ZIP was not generated"
          }

      - name: Upload verified Windows portable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-portable-release
          path: dist/nexusmind-windows-portable.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [tests, python-package, windows-portable]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download Python distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-release-distributions
          path: release-artifacts

      - name: Download Windows portable ZIP
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-portable-release
          path: release-artifacts

      - name: Verify publication set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          actual = {item.name for item in Path("release-artifacts").iterdir() if item.is_file()}
          expected = {
              "nexusmind-0.1.0-py3-none-any.whl",
              "nexusmind-0.1.0.tar.gz",
              "nexusmind-windows-portable.zip",
          }
          if actual != expected:
              raise SystemExit(f"release artifact mismatch: expected {sorted(expected)}, got {sorted(actual)}")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-artifacts/nexusmind-0.1.0-py3-none-any.whl \
            release-artifacts/nexusmind-0.1.0.tar.gz \
            release-artifacts/nexusmind-windows-portable.zip \
            --verify-tag \
            --title "NexusMind $GITHUB_REF_NAME" \
            --notes-file docs/releases/v0.1.0.md
