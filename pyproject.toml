[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nexusmind"
version = "0.1.0"
description = "Provider-neutral bounded Agent runtime with Tool, Workspace, MCP, checkpoint, and lease controls."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4,<5",
  "mcp>=1.27,<2",
  "python-dotenv>=1,<2",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
nexusmind = "nexusmind.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

