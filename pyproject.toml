[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nexusmind"
version = "0.1.0"
description = "Local-first KnowledgeBase with bounded retrieval and provenance-validated answers."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "firecrawl-anydoc==0.2.4",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "PyYAML>=6,<7",
]
packaging = [
  "pyinstaller>=6.10,<7",
]

[project.scripts]
nexusmind = "nexusmind.runtime_entrypoint:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
